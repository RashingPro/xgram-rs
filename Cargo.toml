[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
description = "Powerful yet blazingly fast Telegram Bot API framework written in Rust, featuring advanced abstractions and Tokio-powered concurrency."
license = "MIT"
readme = "docs/README.md"
documentation = "https://github.com/RashingPro/xgram-rs"
repository = "https://github.com/RashingPro/xgram-rs"
authors = ["RashingPro"]
keywords = ["telegram", "bot", "telegram-bot-api", "framework"]
categories = ["api-bindings"]

edition = "2024"
rust-version = "1.88"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
needless_return = { level = "allow" }
new_without_default = { level = "warn" }

[workspace.lints.rust]
unused_imports = { level = "deny" }

[profile.release]
lto = true
codegen-units = 1

[workspace.dependencies]
xgram-proc = { path = "crates/xgram-proc", version = "=0.1.0" }
xgram-telegram-api = { path = "crates/xgram-telegram-api", version = "=0.1.0" }
xgram-utils = { path = "crates/xgram-utils", version = "=0.1.0" }

colored = "3.1.1"
hashbrown = "0.17.1"
log = "0.4.34"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = "3.23.0"
smallvec = { version = "1.16.1", features = ["serde"] } # TODO: We might want to update to 2.x.x when it becomes stable
syn = { version = "3.0.5", features = ["full"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = ["time"] }
quote = "1.0.47"
