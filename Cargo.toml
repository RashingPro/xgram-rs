[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
description = "Powerful yet blazingly fast Telegram Bot API framework written in Rust, featuring advanced abstractions and Tokio-powered concurrency."
license = "MIT"
readme = "docs/README.md"
documentation = "https://github.com/RashingPro/xgram-rs"
repository = "https://github.com/RashingPro/xgram-rs"
authors = ["RashingPro"]
keywords = ["telegram", "bot", "telegram-bot-api", "framework"]
categories = ["api-bindings"]

edition = "2024"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
perf = { level = "deny", priority = -1 }

allow_attributes_without_reason = "deny"
branches_sharing_code = "warn"
collapsible_else_if = "deny"
incompatible_msrv = "forbid"
needless_return = "allow"
new_without_default = "warn"
str_to_string = "warn"
use_self = "deny"

[profile.release]
lto = true
codegen-units = 1

[workspace.dependencies]
xgram-proc = { path = "crates/xgram-proc", version = "=0.2.0" }
xgram-telegram-api = { path = "crates/xgram-telegram-api", version = "=0.2.0" }
xgram-utils = { path = "crates/xgram-utils", version = "=0.2.0" }

tokio = { version = "1.53.1", default-features = false, features = ["time"] }
reqwest = { version = "0.13.5", features = ["json"] }

# Serde
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = "3.23.0"

# Data structures
hashbrown = "0.17.1"
smallvec = { version = "1.16.1", features = ["serde"] } # TODO: We might want to update to 2.x.x when it becomes stable

# Macro
syn = { version = "3.0.5", features = ["full"] }
quote = "1.0.47"

# Utils
colored = "3.1.1"
log = "0.4.34"
str_indices = "0.4.4"
thiserror = "2.0.20"
